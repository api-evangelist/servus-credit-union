      status: 000
      note: Host does not resolve; no first-party developer portal.
    - url: https://api.servus.ca
      status: 000
      note: Host does not resolve; no first-party API host.
    - url: https://www.servus.ca/developer
      status: 404
      note: No developer path on the main site.
    - url: https://www.servus.ca/
      status: 200
      note: Public marketing/banking site; no API documentation.
    - url: https://ib.servus.ca/
      status: 200
      note: Member online-banking login (consumer web app), not a developer API.
