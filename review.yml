aid: servus-credit-union
name: Servus Credit Union
review:
  question: Does Servus Credit Union expose a public first-party developer API or downloadable specifications?
  answer: false
  date: '2026-07-23'
  reviewer: API Evangelist
findings:
  summary: |
    Servus Credit Union publishes no public first-party developer API and runs
    no developer portal. Probing developer.servus.ca and api.servus.ca returned
    no DNS resolution (curl exit / HTTP 000), and https://www.servus.ca/developer
    returns HTTP 404. The public site (https://www.servus.ca/, HTTP 200) documents
    retail/business banking, mortgages, investments, and online/mobile banking,
    but no API reference, OpenAPI/Swagger download, sandbox, or OAuth developer
    onboarding is present anywhere.

    As Alberta's largest credit union and — after the 2023 connectFirst merger —
    Canada's largest by assets, Servus is a provincially regulated, member-owned
    cooperative (Schedule-equivalent provincial credit union, not a Schedule I/II
    bank). Its open-finance access is aggregator-only: third-party financial-data
    aggregators Finicity (Mastercard Open Banking) and Plaid provide
    consumer-permissioned account, balance, transaction, and identity/income
    verification data. Public aggregator coverage notes indicate the Finicity
    connection does not use OAuth (credential/screen-scraping style access),
    which is typical of Canadian credit-union coverage today.

    Canada has NO operational open-banking mandate. The federal Consumer-Driven
    Banking framework (Budget 2024 / Fall Economic Statement 2024, overseen by
    the Financial Consumer Agency of Canada) is legislated but not yet live, so
    there is no first-party FDX/CDB data-access API to harvest. No FDX
    participation and no US-1033-style posture are documented (1033 is a US rule
    and not applicable to this Canadian entity). No first-party Interac e-Transfer
    or Real-Time Rail (Payments Canada) API is exposed — Servus consumes those
    shared rails as a member institution rather than documenting an API around them.
