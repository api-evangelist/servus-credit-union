name: Servus Credit Union
kind: company
description: >-
  Servus Credit Union Ltd. is a member-owned cooperative financial institution
  headquartered in Edmonton, Alberta, founded in 1938. It is Alberta's largest
  credit union and, following its 2023 member-approved merger with connectFirst
  Credit Union, became Canada's largest credit union by total assets (roughly
  $30 billion CAD), serving more than 500,000 members through about 100 branches
  and distributing profits back to members via its Profit Share program rather
  than to outside shareholders. As a provincially regulated Alberta credit union,
  Servus operates within a cooperative charter and offers retail and business
  banking, mortgages, loans, investments, and digital/mobile banking. On the
  open-finance front its posture is aggregator-only and honest: Servus runs no
  public first-party developer portal or documented public API. External data
  access to member accounts today is provided through third-party financial-data
  aggregators (Mastercard Open Banking / Finicity and Plaid) via consumer-permissioned
  connections, consistent with Canada's voluntary, not-yet-operational Consumer-Driven
  Banking framework overseen by the Financial Consumer Agency of Canada (FCAC).
